<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>یار افغانستان</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #0b1020;
      color: white;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      padding: 18px;
      background:
        radial-gradient(circle at top right, rgba(80,100,255,.18), transparent 35%),
        radial-gradient(circle at bottom left, rgba(0,210,180,.10), transparent 35%),
        #0b1020;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: linear-gradient(135deg, #5969ff, #00c9a7);
      box-shadow: 0 8px 30px rgba(70,100,255,.25);
    }

    .brand h1 {
      font-size: 20px;
    }

    .brand p {
      color: #8791a8;
      font-size: 11px;
      margin-top: 4px;
    }

    .clear {
      background: #151d31;
      border: 1px solid #29334c;
      color: #aeb7ca;
      border-radius: 12px;
      padding: 9px 11px;
      cursor: pointer;
    }

    .chat {
      height: calc(100vh - 180px);
      min-height: 430px;
      overflow-y: auto;
      padding: 8px 2px 15px;
      scroll-behavior: smooth;
    }

    .welcome {
      text-align: center;
      padding: 65px 20px 30px;
    }

    .welcome .big {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .welcome h2 {
      font-size: 22px;
      margin-bottom: 9px;
    }

    .welcome p {
      color: #8993aa;
      font-size: 13px;
      line-height: 2;
    }

    .message {
      display: flex;
      margin: 11px 0;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.ai {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 84%;
      padding: 12px 15px;
      border-radius: 18px;
      line-height: 1.9;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble {
      background: #202b49;
      border-bottom-right-radius: 5px;
    }

    .ai .bubble {
      background: linear-gradient(135deg, #4658d9, #33429f);
      border-bottom-left-radius: 5px;
    }

    .input-area {
      position: sticky;
      bottom: 0;
      display: flex;
      gap: 8px;
      padding-top: 10px;
      background: linear-gradient(transparent, #0b1020 25%);
    }

    .input-area input {
      flex: 1;
      min-width: 0;
      height: 52px;
      padding: 0 15px;
      border-radius: 17px;
      border: 1px solid #29334c;
      outline: none;
      background: #121a2d;
      color: white;
      font-size: 14px;
    }

    .input-area input::placeholder {
      color: #68748c;
    }

    .send {
      width: 52px;
      height: 52px;
      border: 0;
      border-radius: 17px;
      color: white;
      background: linear-gradient(135deg, #5969ff, #7b55ff);
      font-size: 20px;
      cursor: pointer;
    }

    .send:active {
      transform: scale(.95);
    }

    .typing {
      opacity: .7;
    }
  </style>
</head>

<body>

<div class="app">

  <header class="top">

    <div class="brand">

      <div class="logo">✨</div>

      <div>
        <h1>یار افغانستان</h1>
        <p>دستیار هوشمند تو</p>
      </div>

    </div>

    <button class="clear" onclick="clearChat()">پاک کردن</button>

  </header>


  <main class="chat" id="chat">

    <div class="welcome" id="welcome">

      <div class="big">🤖</div>

      <h2>سلام! من یار هستم 👋</h2>

      <p>
        سوالت را بنویس.<br>
        من آماده کمک به تو هستم.
      </p>

    </div>

  </main>


  <div class="input-area">

    <input
      id="input"
      type="text"
      placeholder="مثلاً: چی کارهایی می‌توانی انجام بدهی؟"
      onkeydown="handleKey(event)"
    >

    <button class="send" onclick="sendMessage()">➤</button>

  </div>

</div>


<script>

  const input = document.getElementById("input");
  const chat = document.getElementById("chat");


  function handleKey(event) {

    if (event.key === "Enter") {
      sendMessage();
    }

  }


  function addMessage(text, type) {

    const welcome = document.getElementById("welcome");

    if (welcome) {
      welcome.remove();
    }

    const message = document.createElement("div");

    message.className = "message " + type;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    message.appendChild(bubble);

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

  }


  function getAIResponse(text) {

    const t = text
      .toLowerCase()
      .replace(/ي/g, "ی")
      .replace(/ك/g, "ک")
      .trim();


    /* سلام */

    if (
      t.includes("سلام") ||
      t.includes("hello") ||
      t.includes("hi") ||
      t.includes("درود")
    ) {

      return "سلام! 👋🇦🇫\n\nمن «یار افغانستان» هستم.\nخوشحالم که با من صحبت می‌کنی.\n\nچطور می‌توانم کمکت کنم؟";

    }


    /* خوبی */

    if (
      t.includes("خوبی") ||
      t.includes("چطوری") ||
      t.includes("حالت چطوره")
    ) {

      return "ممنون! 😊 من خوبم و آماده‌ام به تو کمک کنم.";

    }


    /* قابلیت ها */

    if (
      t.includes("چه کار") ||
      t.includes("چی کار") ||
      t.includes("چه کاری") ||
      t.includes("چی کاری") ||
      t.includes("چه کارهایی") ||
      t.includes("چی کارهایی") ||
      t.includes("چه کار ها") ||
      t.includes("چی کار ها") ||
      t.includes("چه کارهای") ||
      t.includes("چی کارهای") ||
      t.includes("قابلیت") ||
      t.includes("توانایی") ||
      t.includes("چه چیز") ||
      t.includes("چه میتونی") ||
      t.includes("چه میتوانی") ||
      t.includes("چه می‌توانی")
    ) {

      return "من «یار افغانستان» هستم 🤖🇦🇫\n\nفعلاً در نسخه آزمایشی می‌توانم:\n\n🌐 درباره ترجمه کمک کنم\n📚 در مورد درس‌ها راهنمایی کنم\n✍️ برای نوشتن متن و پیام کمک کنم\n🛒 برای ساخت آگهی فروش ایده بدهم\n💡 به سوال‌های ساده پاسخ بدهم\n💬 با تو به فارسی/دری گفتگو کنم\n\n🚀 قابلیت‌هایی که در نسخه‌های بعدی اضافه می‌کنیم:\n\n🎙️ صحبت با صدا\n📷 خواندن متن از عکس\n🇦🇫 ترجمه دری ↔ پشتو\n🇬🇧 ترجمه انگلیسی\n🧠 هوش مصنوعی واقعی\n📄 ساخت PDF\n\nهدف ما این است که «یار» به یک دستیار کاربردی برای مردم افغانستان تبدیل شود.";

    }


    /* کمک */

    if (
      t.includes("کمک") ||
      t.includes("کمکم کن")
    ) {

      return "حتماً 🤝\n\nموضوعت را برایم بنویس.\nمثلاً:\n\n«برای فروش موبایلم آگهی بنویس»\nیا\n«این جمله را ترجمه کن»\nیا\n«در درس ریاضی کمکم کن»";

    }


    /* ترجمه */

    if (
      t.includes("ترجمه") ||
      t.includes("translate")
    ) {

      return "🌐 بخش ترجمه در حال توسعه است.\n\nدر نسخه بعدی، ترجمه دری، پشتو و انگلیسی را به‌صورت واقعی اضافه می‌کنیم.";

    }


    /* پشتو */

    if (
      t.includes("پشتو")
    ) {

      return "🇦🇫 پشتیبانی کامل از زبان پشتو یکی از قابلیت‌های اصلی یار خواهد بود.\n\nدر مرحله بعد ترجمه دری ↔ پشتو را اضافه می‌کنیم.";

    }


    /* درس */

    if (
      t.includes("درس") ||
      t.includes("ریاضی") ||
      t.includes("فیزیک") ||
      t.includes("کیمیا") ||
      t.includes("سوال")
    ) {

      return "📚 حتماً!\n\nسؤال درسی‌ات را بنویس یا در نسخه بعدی از آن عکس بگیر.\n\nدر نسخه هوشمند، یار می‌تواند مسئله را مرحله‌به‌مرحله توضیح دهد.";

    }


    /* آگهی */

    if (
      t.includes("آگهی") ||
      t.includes("اعلان") ||
      t.includes("فروش") ||
      t.includes("موبایل")
    ) {

      return "🛒 برای ساخت آگهی حرفه‌ای این اطلاعات را بده:\n\n📱 نام محصول\n💰 قیمت\n📍 شهر\n⭐ وضعیت محصول\n📞 روش تماس\n\nبعد می‌توانیم آگهی مرتب و جذاب بسازیم.";

    }


    /* نوشتن */

    if (
      t.includes("بنویس") ||
      t.includes("نوشتن") ||
      t.includes("پیام") ||
      t.includes("متن")
    ) {

      return "✍️ حتماً.\n\nبگو چه متنی می‌خواهی؛ مثلاً:\n\n«برای استاد دانشگاه یک پیام محترمانه بنویس.»\n\nیا:\n\n«برای فروش موبایلم متن تبلیغاتی بنویس.»";

    }


    /* تشکر */

    if (
      t.includes("تشکر") ||
      t.includes("ممنون") ||
      t.includes("مرسی")
    ) {

      return "خواهش می‌کنم! ❤️🇦🇫\nهر وقت خواستی من اینجا هستم.";

    }


    /* خداحافظی */

    if (
      t.includes("خداحافظ") ||
      t.includes("بای")
    ) {

      return "خداحافظ! 👋\nامیدوارم دوباره ببینمت.";

    }


    /* پاسخ پیش فرض */

    return "پیامت را دریافت کردم ✅\n\nفعلاً من نسخه آزمایشی «یار» هستم و هنوز به هوش مصنوعی واقعی وصل نشده‌ام. 🤖\n\nاما می‌توانیم قدم‌به‌قدم قابلیت‌های بیشتری به من اضافه کنیم.";

  }


  function sendMessage() {

    const text = input.value.trim();

    if (!text) {
      return;
    }


    addMessage(text, "user");

    input.value = "";


    /* حالت تایپ */

    const typing = document.createElement("div");

    typing.className = "message ai";

    typing.id = "typing";

    typing.innerHTML =
      '<div class="bubble typing">یار در حال فکر کردن... 🤔</div>';

    chat.appendChild(typing);

    chat.scrollTop = chat.scrollHeight;


    setTimeout(function() {

      const oldTyping = document.getElementById("typing");

      if (oldTyping) {
        oldTyping.remove();
      }

      const response = getAIResponse(text);

      addMessage(response, "ai");

    }, 500);

  }


  function clearChat() {

    chat.innerHTML = `
      <div class="welcome" id="welcome">

        <div class="big">🤖</div>

        <h2>سلام! من یار هستم 👋</h2>

        <p>
          سوالت را بنویس.<br>
          من آماده کمک به تو هستم.
        </p>

      </div>
    `;

  }

</script>

</body>
</html>
