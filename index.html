<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>یار افغانستان</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .app {
      max-width: 900px;
      min-height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: #f4f7fb;
    }

    header {
      background: #075e54;
      color: white;
      padding: 20px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      opacity: .9;
      font-size: 15px;
    }

    /* =========================
       LANGUAGE SELECTOR
    ========================= */

    .language-bar {
      background: white;
      padding: 10px 15px;
      display: flex;
      justify-content: center;
      gap: 8px;
      border-bottom: 1px solid #ddd;
    }

    .language-btn {
      border: 1px solid #d4d4d4;
      background: #f5f5f5;
      color: #333;
      border-radius: 9px;
      padding: 7px 14px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
    }

    .language-btn.active {
      background: #075e54;
      color: white;
      border-color: #075e54;
    }

    /* =========================
       TOOLS
    ========================= */

    .tools {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      padding: 10px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .tool {
      border: 0;
      background: #eef3f5;
      padding: 12px 5px;
      min-height: 55px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      color: #222;
    }

    .tool.active {
      background: #075e54;
      color: white;
    }

    /* =========================
       CHAT
    ========================= */

    #chatMessages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      min-height: 55vh;
    }

    .message {
      display: flex;
      margin: 10px 0;
    }

    .user-message {
      justify-content: flex-start;
    }

    .ai-message {
      justify-content: flex-end;
    }

    .message-content {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 15px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user-message .message-content {
      background: #d9fdd3;
    }

    .ai-message .message-content {
      background: white;
      border: 1px solid #ddd;
    }

    .loading-message .message-content {
      color: #777;
    }

    /* =========================
       WELCOME
    ========================= */

    .welcome {
      text-align: center;
      padding: 45px 20px;
      color: #555;
    }

    .welcome h2 {
      color: #075e54;
      margin-bottom: 10px;
    }

    /* =========================
       INPUT
    ========================= */

    .input-area {
      background: white;
      border-top: 1px solid #ddd;
      padding: 12px;
      position: sticky;
      bottom: 0;
    }

    #chatForm {
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      resize: none;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 12px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    #messageInput:focus {
      border-color: #075e54;
    }

    #sendButton {
      border: 0;
      border-radius: 12px;
      background: #075e54;
      color: white;
      padding: 0 20px;
      cursor: pointer;
      font-family: inherit;
      font-size: 20px;
    }

    #sendButton:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    @media (max-width: 650px) {
      .tools {
        grid-template-columns: repeat(3, 1fr);
      }

      .message-content {
        max-width: 92%;
      }

      #sendButton {
        padding: 0 15px;
      }
    }

    @media (max-width: 380px) {
      .language-btn {
        padding: 6px 10px;
        font-size: 12px;
      }

      .tool {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =========================
       HEADER
  ========================== -->

  <header>
    <h1 id="appTitle">🤖 یار افغانستان</h1>
    <p id="appSubtitle">
      دستیار هوشمند دری، پشتو و انگلیسی
    </p>
  </header>


  <!-- =========================
       LANGUAGE
  ========================== -->

  <div class="language-bar">

    <button
      type="button"
      class="language-btn active"
      data-language="fa">
      دری
    </button>

    <button
      type="button"
      class="language-btn"
      data-language="ps">
      پښتو
    </button>

    <button
      type="button"
      class="language-btn"
      data-language="en">
      English
    </button>

  </div>


  <!-- =========================
       FIVE TOOLS
  ========================== -->

  <div class="tools">

    <button
      type="button"
      class="tool active"
      data-mode="chat"
      id="toolChat">
      💬 چت
    </button>

    <button
      type="button"
      class="tool"
      data-mode="translate"
      id="toolTranslate">
      🌐 مترجم
    </button>

    <button
      type="button"
      class="tool"
      data-mode="study"
      id="toolStudy">
      📚 کمک‌درسی
    </button>

    <button
      type="button"
      class="tool"
      data-mode="writing"
      id="toolWriting">
      ✍️ نوشتن
    </button>

    <button
      type="button"
      class="tool"
      data-mode="ad"
      id="toolAd">
      📢 آگهی
    </button>

  </div>


  <!-- =========================
       CHAT
  ========================== -->

  <main id="chatMessages">

    <div class="welcome">

      <h2 id="welcomeTitle">
        سلام! 👋
      </h2>

      <p id="welcomeText">
        من یار افغانستان هستم.
        می‌توانم در چت، ترجمه، درس، نوشتن و ساخت آگهی به شما کمک کنم.
      </p>

      <p id="welcomeHint">
        پیام خود را بنویسید و ارسال کنید.
      </p>

    </div>

  </main>


  <!-- =========================
       INPUT
  ========================== -->

  <div class="input-area">

    <form id="chatForm">

      <textarea
        id="messageInput"
        rows="2"
        placeholder="پیامتان را بنویسید..."
        autocomplete="off"></textarea>

      <button
        id="sendButton"
        type="submit"
        aria-label="ارسال">
        ➤
      </button>

    </form>

  </div>

</div>


<script>

let currentMode = "chat";
let currentLanguage = "fa";
let isSending = false;

/* =====================================================
   Promptهای پنج بخش
===================================================== */

const modePrompts = {

  translate: {

    ps:
      "ته د افغانستان یار مسلکي ژباړن یې. د کارونکي متن په دقیق او طبیعي ډول وژباړه. که د هدف ژبه مشخصه وي، هماغه ژبه وکاروه. یوازې وروستۍ ژباړه وړاندې کړه.\n\n",

    ps:

    en:
      "You are a professional writer for Yar Afghanistan. Based on the user's request, write a ready-to-use text. Make it natural, organized and professional.\n\n"
  },

  ad: {
    fa:
      "تو متخصص ساخت آگهی یار افغانستان هستی. بر اساس اطلاعات کاربر یک آگهی جذاب و حرفه‌ای بساز. عنوان، توضیح و اطلاعات مهم را مرتب کن.\n\n",

    ps:
      "ته د افغانستان یار د اعلانونو متخصص یې. د کارونکي د معلوماتو پر بنسټ یو زړه راښکونکی او مسلکي اعلان جوړ کړه. سرلیک، تشریح او مهم معلومات منظم کړه.\n\n",

    en:
      "You are an advertisement specialist for Yar Afghanistan. Based on the user's information, create an attractive and professional advertisement with a title, description and important details.\n\n"
  }

};


/* =====================================================
   پاک کردن Thinking
===================================================== */

function cleanAIResponse(text) {

  if (typeof text !== "string") {
    return "";
  }

  let result = text;

  result = result.replace(
    /<think[\s\S]*?<\/think>/gi,
    ""
  );

  result = result.replace(
    /<thinking[\s\S]*?<\/thinking>/gi,
    ""
  );

  result = result.replace(
    /<reasoning[\s\S]*?<\/reasoning>/gi,
    ""
  );

  result = result.replace(
    /<analysis[\s\S]*?<\/analysis>/gi,
    ""
  );

  result = result.replace(
    /^\s*(thinking|reasoning|analysis)\s*:\s*[\s\S]*?(?=\n\s*(answer|final|پاسخ|پاسخ نهایی)\s*:)/i,
    ""
  );

  result = result.replace(
    /^\s*(answer|final|پاسخ|پاسخ نهایی)\s*:\s*/i,
    ""
  );

  return result.trim();
}


/* =====================================================
   نمایش پیام
===================================================== */

function addChatMessage(text, sender = "ai") {

  const chat =
    document.getElementById("chatMessages");

  if (!chat) {
    return null;
  }

  const welcome =
    chat.querySelector(".welcome");

  if (welcome) {
    welcome.remove();
  }

  const message =
    document.createElement("div");

  message.className =
    sender === "user"
      ? "message user-message"
      : "message ai-message";

  const content =
    document.createElement("div");

  content.className =
    "message-content";

  content.textContent = text;

  message.appendChild(content);
  chat.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;

  return message;
}


/* =====================================================
   Loading
===================================================== */

function addLoadingMessage() {

  const chat =
    document.getElementById("chatMessages");

  if (!chat) {
    return null;
  }

  const message =
    document.createElement("div");

  message.className =
    "message ai-message loading-message";

  const content =
    document.createElement("div");

  content.className =
    "message-content";

  content.textContent =
    UI[currentLanguage].loading;

  message.appendChild(content);
  chat.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;

  return message;
}


/* =====================================================
   به‌روزرسانی زبان رابط
===================================================== */

function applyLanguage(language) {

  if (!UI[language]) {
    language = "fa";
  }

  currentLanguage = language;

  const t = UI[language];

  document.documentElement.lang =
    t.htmlLang;

  document.documentElement.dir =
    t.dir;

  document.title =
    t.title.replace("🤖 ", "");

  document.getElementById("appTitle").textContent =
    t.title;

  document.getElementById("appSubtitle").textContent =
    t.subtitle;

  document.getElementById("toolChat").textContent =
    t.chat;

  document.getElementById("toolTranslate").textContent =
    t.translate;

  document.getElementById("toolStudy").textContent =
    t.study;

  document.getElementById("toolWriting").textContent =
    t.writing;

  document.getElementById("toolAd").textContent =
    t.ad;

  document.getElementById("welcomeTitle").textContent =
    t.welcomeTitle;

  document.getElementById("welcomeText").textContent =
    t.welcomeText;

  document.getElementById("welcomeHint").textContent =
    t.welcomeHint;

  document.getElementById("messageInput").placeholder =
    t.placeholders[currentMode];

  document.getElementById("sendButton").setAttribute(
    "aria-label",
    language === "en" ? "Send" : "ارسال"
  );

  document
    .querySelectorAll(".language-btn")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.language === language
      );

    });

}


/* =====================================================
   تغییر زبان
===================================================== */

function setupLanguages() {

  document
    .querySelectorAll(".language-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          applyLanguage(
            button.dataset.language
          );

        }
      );

    });

}


/* =====================================================
   تغییر بخش
===================================================== */

function setupTools() {

  const buttons =
    document.querySelectorAll(".tool");

  const input =
    document.getElementById("messageInput");

  buttons.forEach(button => {

    button.addEventListener(
      "click",
      () => {

        buttons.forEach(item => {
          item.classList.remove("active");
        });

        button.classList.add("active");

        currentMode =
          button.dataset.mode || "chat";

        if (input) {
          input.placeholder =
            UI[currentLanguage]
              .placeholders[currentMode];

          input.focus();
        }

      }
    );

  });

}


/* =====================================================
   ارسال پیام
===================================================== */

async function sendMessageToAI(message) {

  const userMessage =
    typeof message === "string"
      ? message.trim()
      : "";

  if (!userMessage || isSending) {
    return;
  }

  isSending = true;

  addChatMessage(
    userMessage,
    "user"
  );

  const loading =
    addLoadingMessage();

  try {

    let finalMessage =
      userMessage;


    /*
     * برای چهار بخش ویژه Prompt مناسب
     * با توجه به زبان رابط اضافه می‌شود.
     */

    if (
      currentMode !== "chat" &&
      modePrompts[currentMode]
    ) {

      const prompt =
        modePrompts[currentMode][
          currentLanguage
        ] ||
        modePrompts[currentMode].fa;

      finalMessage =
        prompt +
        userMessage;
    }


    const response =
      await fetch(
        CHAT_API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",
            "Accept":
              "application/json"
          },

          body:
            JSON.stringify({
              message: finalMessage
            })
        }
      );


    const rawText =
      await response.text();


    let data;

    try {

      data =
        JSON.parse(rawText);

    } catch {

      throw new Error(
        UI[currentLanguage].invalidResponse
      );
    }


    if (loading) {
      loading.remove();
    }


    if (
      !response.ok ||
      data?.success === false
    ) {

      console.error(
        "Yar API Error:",
        response.status,
        data
      );

      let error =
        data?.error ||
        UI[currentLanguage].connectionError;

      if (response.status === 429) {

        error =
          currentLanguage === "en"
            ? "Free AI requests are temporarily rate limited. Please try again later."
            : currentLanguage === "ps"
              ? "د وړیا AI غوښتنې اوس مهال محدودې شوې دي. لږ وروسته بیا هڅه وکړئ."
              : "⏳ درخواست‌های رایگان فعلاً به سقف رسیده‌اند. کمی بعد دوباره تلاش کنید.";

      }

      addChatMessage(
        "❌ " + error,
        "ai"
      );

      return;
    }


    let answer =
      data?.reply;


    if (
      typeof answer !== "string" ||
      !answer.trim()
    ) {

      answer =
        data?.message;
    }


    if (
      typeof answer !== "string" ||
      !answer.trim()
    ) {

      addChatMessage(
        UI[currentLanguage].emptyResponse,
        "ai"
      );

      return;
    }


    answer =
      cleanAIResponse(answer);


    if (!answer) {

      addChatMessage(
        UI[currentLanguage].noAnswer,
        "ai"
      );

      return;
    }


    /*
     * فقط پاسخ نهایی نمایش داده می‌شود.
     */

    addChatMessage(
      answer,
      "ai"
    );


  } catch (error) {

    if (loading) {
      loading.remove();
    }

    console.error(
      "Yar Afghanistan API connection error:",
      error
    );

    addChatMessage(
      UI[currentLanguage].connectionError,
      "ai"
    );

  } finally {

    isSending = false;

  }

}


/* =====================================================
   فرم
===================================================== */

function setupChatForm() {

  const form =
    document.getElementById("chatForm");

  const input =
    document.getElementById("messageInput");

  const sendButton =
    document.getElementById("sendButton");


  if (!form || !input) {

    console.error(
      "Chat form or input not found."
    );

    return;
  }


  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      if (isSending) {
        return;
      }

      const message =
        input.value.trim();

      if (!message) {
        return;
      }

      input.value = "";

      if (sendButton) {
        sendButton.disabled = true;
      }

      try {

        await sendMessageToAI(
          message
        );

      } finally {

        if (sendButton) {
          sendButton.disabled = false;
        }

        input.focus();

      }

    }
  );


  input.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        form.requestSubmit();

      }

    }
  );

}


/* =====================================================
   شروع
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    setupLanguages();
    setupTools();
    setupChatForm();

    applyLanguage("fa");

    console.log(
      "Yar Afghanistan loaded successfully."
    );

    console.log(
      "API:",
      CHAT_API_URL
    );

  }
);

</script>
