<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>یار افغانستان</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #0b1020;
      color: #ffffff;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      padding: 22px 18px 30px;
      background:
        radial-gradient(circle at top right, rgba(80, 100, 255, .18), transparent 35%),
        radial-gradient(circle at bottom left, rgba(0, 210, 180, .10), transparent 35%),
        #0b1020;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 35px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      background: linear-gradient(135deg, #5b6cff, #00c9a7);
      box-shadow: 0 8px 30px rgba(70, 100, 255, .25);
    }

    .brand h1 {
      font-size: 21px;
    }

    .brand p {
      color: #8f98ad;
      font-size: 12px;
      margin-top: 4px;
    }

    .menu {
      width: 42px;
      height: 42px;
      border: 1px solid #252d43;
      border-radius: 14px;
      background: #12192b;
      color: white;
      font-size: 20px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      font-size: 28px;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .welcome span {
      background: linear-gradient(90deg, #6d7cff, #00d6b4);
      -webkit-background-clip: text;
      color: transparent;
    }

    .welcome p {
      color: #929bb0;
      font-size: 14px;
      line-height: 1.9;
    }

    .chat-box {
      border: 1px solid #293149;
      background: rgba(18, 25, 43, .85);
      border-radius: 24px;
      padding: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 15px 45px rgba(0,0,0,.25);
      margin-bottom: 28px;
    }

    .chat-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 14px;
      min-width: 0;
    }

    .chat-box input::placeholder {
      color: #687289;
    }
