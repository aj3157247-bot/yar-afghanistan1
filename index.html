<script>
async function sendMessage() {
    const input = document.getElementById("input");
    const text = input.value.trim();

    if (!text) return;

    // نمایش پیام کاربر
    addMessage(text, "user");
    input.value = "";

    // پیام موقت
    const loadingId = "ai-loading-" + Date.now();

    const loadingMessage = document.createElement("div");
    loadingMessage.className = "message ai";
    loadingMessage.id = loadingId;

    const loadingBubble = document.createElement("div");
    loadingBubble.className = "bubble";
    loadingBubble.textContent = "🤖 در حال فکر کردن...";

    loadingMessage.appendChild(loadingBubble);
    chat.appendChild(loadingMessage);
    chat.scrollTop = chat.scrollHeight;

    try {
        // اتصال مستقیم به Cloudflare Pages Function
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                message: text
            })
        });

        // حذف پیام در حال پردازش
        const loadingElement = document.getElementById(loadingId);
        if (loadingElement) {
            loadingElement.remove();
        }

        // پاسخ خام سرور
        const rawText = await response.text();

        let data;

        try {
            data = JSON.parse(rawText);
        } catch (error) {
            console.error("Invalid JSON from /api/chat:", rawText);

            addMessage(
                "❌ سرور پاسخ معتبر نداد.\n\nکد خطا: " + response.status,
                "ai"
            );

            return;
        }

        console.log("Yar API response:", data);

        // اگر API خطا داده باشد
        if (!response.ok || data.success === false) {
            let errorMessage = data.error || "ارتباط با هوش مصنوعی برقرار نشد.";

            if (data.provider_error) {
                console.error("OpenRouter:", data.provider_error);
            }

            addMessage(
                "❌ " + errorMessage,
                "ai"
            );

            return;
        }

        // chat.js پاسخ را با reply برمی‌گرداند
        const answer =
            typeof data.reply === "string"
                ? data.reply
                : typeof data.message === "string"
                    ? data.message
                    : "";

        if (!answer.trim()) {
            addMessage(
                "❌ هوش مصنوعی پاسخ خالی فرستاد.",
                "ai"
            );

            return;
        }

        // نمایش پاسخ واقعی AI
        addMessage(answer, "ai");

    } catch (error) {
        console.error("Yar API connection error:", error);

        const loadingElement = document.getElementById(loadingId);
        if (loadingElement) {
            loadingElement.remove();
        }

        addMessage(
            "❌ ارتباط با هوش مصنوعی برقرار نشد.\n\n" +
            "لطفاً اتصال اینترنت و API را بررسی کنید.",
            "ai"
        );
    }
}
</script>
