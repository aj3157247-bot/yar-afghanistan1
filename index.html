<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>یار افغانستان</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #0b1020;
      color: #ffffff;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      padding: 22px 18px 30px;
      background:
        radial-gradient(circle at top right, rgba(80, 100, 255, .18), transparent 35%),
        radial-gradient(circle at bottom left, rgba(0, 210, 180, .10), transparent 35%),
        #0b1020;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 35px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      background: linear-gradient(135deg, #5b6cff, #00c9a7);
      box-shadow: 0 8px 30px rgba(70, 100, 255, .25);
    }

    .brand h1 {
      font-size: 21px;
    }

    .brand p {
      color: #8f98ad;
      font-size: 12px;
      margin-top: 4px;
    }

    .menu {
      width: 42px;
      height: 42px;
      border: 1px solid #252d43;
      border-radius: 14px;
      background: #12192b;
      color: white;
      font-size: 20px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      font-size: 28px;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .welcome span {
      background: linear-gradient(90deg, #6d7cff, #00d6b4);
      -webkit-background-clip: text;
      color: transparent;
    }

    .welcome p {
      color: #929bb0;
      font-size: 14px;
      line-height: 1.9;
    }

    .chat-box {
      border: 1px solid #293149;
      background: rgba(18, 25, 43, .85);
      border-radius: 24px;
      padding: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 15px 45px rgba(0,0,0,.25);
      margin-bottom: 28px;
    }

    .chat-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 14px;
      min-width: 0;
    }

    .chat-box input::placeholder {
      color: #687289;
    }

    .mic {
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 16px;
      color: white;
      background: linear-gradient(135deg, #5969ff, #7c55ff);
      font-size: 20px;
      cursor: pointer;
    }

    .section-title {
      font-size: 17px;
      margin-bottom: 14px;
    }

    .tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .tool {
      min-height: 125px;
      padding: 17px;
      border-radius: 21px;
      border: 1px solid #252e45;
      background: #11182a;
      color: white;
      text-align: right;
      cursor: pointer;
      transition: .2s;
    }

    .tool:active {
      transform: scale(.97);
    }

    .tool-icon {
      width: 43px;
      height: 43px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1b2440;
      font-size: 21px;
      margin-bottom: 13px;
    }

    .tool h3 {
      font-size: 14px;
      margin-bottom: 6px;
    }

    .tool p {
      color: #7f899f;
      font-size: 11px;
    }

    .footer {
      text-align: center;
      color: #555f75;
      font-size: 11px;
      margin-top: 35px;
    }

    @media (min-width: 700px) {
      .app {
        margin-top: 20px;
        border-radius: 30px;
        min-height: calc(100vh - 40px);
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="top">
      <div class="brand">
        <div class="logo">✨</div>
        <div>
          <h1>یار افغانستان</h1>
          <p>دستیار هوشمند تو</p>
        </div>
      </div>

      <button class="menu">☰</button>
    </header>

    <section class="welcome">
      <h2>سلام 👋<br><span>چه کمکی از من می‌خواهی؟</span></h2>
      <p>
        سوالت را بنویس یا با صدایت بگو.
        یار آماده کمک به توست.
      </p>
    </section>

    <section class="chat-box">
      <input
        type="text"
        id="message"
        placeholder="مثلاً: این متن را ترجمه کن..."
      >

      <button class="mic" onclick="sendMessage()">➤</button>
    </section>

    <h3 class="section-title">ابزارهای سریع</h3>

    <section class="tools">

      <button class="tool" onclick="tool('ترجمه')">
        <div class="tool-icon">🌐</div>
        <h3>ترجمه</h3>
        <p>دری، پشتو و انگلیسی</p>
      </button>

      <button class="tool" onclick="tool('دوربین')">
        <div class="tool-icon">📷</div>
        <h3>خواندن عکس</h3>
        <p>تبدیل عکس به متن</p>
      </button>

      <button class="tool" onclick="tool('درس')">
        <div class="tool-icon">📚</div>
        <h3>کمک درسی</h3>
        <p>توضیح ساده درس‌ها</p>
      </button>

      <button class="tool" onclick="tool('نوشتن')">
        <div class="tool-icon">✍️</div>
        <h3>نوشتن متن</h3>
        <p>پیام، آگهی و متن رسمی</p>
      </button>

    </section>

    <div class="footer">
      ساخته‌شده برای افغانستان 🇦🇫
    </div>

  </main>

  <script>
    function sendMessage() {
      const input = document.getElementById("message");
      const text = input.value.trim();

      if (!text) {
        alert("اول یک پیام بنویس 😊");
        return;
      }

      alert("پیام دریافت شد:\n\n" + text);
      input.value = "";
    }

    function tool(name) {
      alert("ابزار «" + name + "» به‌زودی فعال می‌شود 🚀");
    }
  </script>

</body>
</html>
