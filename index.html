<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>یار افغانستان</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #075e54;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 25px;
    }

    header p {
      margin: 0;
      opacity: .9;
      font-size: 14px;
    }

    #chatMessages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      min-height: 65vh;
    }

    .message {
      display: flex;
      margin: 12px 0;
    }

    .user-message {
      justify-content: flex-start;
    }

    .ai-message {
      justify-content: flex-end;
    }

    .message-content {
      max-width: 80%;
      padding: 13px 16px;
      border-radius: 15px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user-message .message-content {
      background: #d9fdd3;
      border-bottom-left-radius: 4px;
    }

    .ai-message .message-content {
      background: white;
      border: 1px solid #e3e8ee;
      border-bottom-right-radius: 4px;
    }

    .loading-message .message-content {
      color: #777;
    }

    .input-area {
      background: white;
      padding: 15px;
      border-top: 1px solid #ddd;
      position: sticky;
      bottom: 0;
    }

    #chatForm {
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      resize: none;
      border: 1px solid #ccd3da;
      border-radius: 12px;
      padding: 13px;
      font-family: inherit;
      font-size: 16px;
      outline: none;
      min-height: 48px;
    }

    #messageInput:focus {
      border-color: #075e54;
    }

    #sendButton {
      border: none;
      border-radius: 12px;
      background: #075e54;
      color: white;
      padding: 0 20px;
      cursor: pointer;
      font-size: 15px;
    }

    #sendButton:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .welcome {
      text-align: center;
      margin: 80px 20px;
      color: #555;
    }

    .welcome h2 {
      color: #075e54;
      margin-bottom: 10px;
    }

    @media (max-width: 600px) {
      .message-content {
        max-width: 90%;
      }

      #sendButton {
        padding: 0 14px;
      }

      #chatMessages {
        min-height: 70vh;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>🤖 یار افغانستان</h1>
    <p>دستیار هوشمند دری، پشتو و انگلیسی</p>
  </header>

  <main id="chatMessages">

    <div class="welcome">
      <h2>سلام! 👋</h2>
      <p>
        من یار افغانستان هستم.
        سوالت را بنویس تا کمکت کنم.
      </p>
    </div>

  </main>

  <div class="input-area">

    <form id="chatForm">

      <textarea
        id="messageInput"
        placeholder="پیامت را بنویس..."
        autocomplete="off"
        rows="1"
      ></textarea>

      <button
        id="sendButton"
        type="submit"
      >
        ارسال ➤
      </button>

    </form>

  </div>

</div>

<!-- =====================================================
     YAR AFGHANISTAN - AI JAVASCRIPT
     این کد داخل SCRIPT قرار دارد و روی صفحه نمایش داده نمی‌شود
===================================================== -->

<script>

const CHAT_API_URL = "/api/chat";

/* -------------------------------------------------------
   حذف Thinking / Reasoning
------------------------------------------------------- */

function cleanAIResponse(text) {

  if (!text || typeof text !== "string") {
    return "";
  }

  let result = text;

  result = result.replace(
    /<think[\s\S]*?<\/think>/gi,
    ""
  );

  result = result.replace(
    /<thinking[\s\S]*?<\/thinking>/gi,
    ""
  );

  result = result.replace(
    /<reasoning[\s\S]*?<\/reasoning>/gi,
    ""
  );

  result = result.replace(
    /<analysis[\s\S]*?<\/analysis>/gi,
    ""
  );

  result = result.replace(
    /^\s*(thinking|reasoning|analysis)\s*:\s*[\s\S]*?(?=\n\s*(answer|final|پاسخ)\s*:)/i,
    ""
  );

  result = result.replace(
    /^\s*(answer|final|پاسخ نهایی|پاسخ)\s*:\s*/i,
    ""
  );

  result = result.replace(
    /^```(?:text|markdown)?\s*/i,
    ""
  );

  result = result.replace(
    /\s*```$/i,
    ""
  );

  return result.trim();
}


/* -------------------------------------------------------
   پیدا کردن محل پیام‌ها
------------------------------------------------------- */

function getChatContainer() {

  return (
    document.getElementById("chatMessages") ||
    document.getElementById("messages") ||
    document.querySelector(".chat-messages")
  );

}


/* -------------------------------------------------------
   نمایش پیام
------------------------------------------------------- */

function addChatMessage(text, sender = "ai") {

  const chatContainer = getChatContainer();

  if (!chatContainer) {

    console.error(
      "Chat container not found."
    );

    return null;
  }

  /*
   * حذف پیام خوش‌آمدگویی هنگام اولین پیام
   */

  const welcome =
    chatContainer.querySelector(".welcome");

  if (welcome) {
    welcome.remove();
  }

  const messageElement =
    document.createElement("div");

  messageElement.className =
    sender === "user"
      ? "message user-message"
      : "message ai-message";

  const content =
    document.createElement("div");

  content.className =
    "message-content";

  /*
   * استفاده از textContent برای امنیت
   */

  content.textContent = text;

  messageElement.appendChild(content);

  chatContainer.appendChild(
    messageElement
  );

  chatContainer.scrollTop =
    chatContainer.scrollHeight;

  return messageElement;
}


/* -------------------------------------------------------
   Loading
------------------------------------------------------- */

function addLoadingMessage() {

  const chatContainer =
    getChatContainer();

  if (!chatContainer) {
    return null;
  }

  const loading =
    document.createElement("div");

  loading.className =
    "message ai-message loading-message";

  const content =
    document.createElement("div");

  content.className =
    "message-content";

  content.textContent =
    "در حال پاسخ...";

  loading.appendChild(content);

  chatContainer.appendChild(
    loading
  );

  chatContainer.scrollTop =
    chatContainer.scrollHeight;

  return loading;
}


/* -------------------------------------------------------
   ارسال پیام به AI
------------------------------------------------------- */

async function sendMessageToAI(message) {

  const userMessage =
    typeof message === "string"
      ? message.trim()
      : "";

  if (!userMessage) {
    return;
  }

  /*
   * پیام کاربر
   */

  addChatMessage(
    userMessage,
    "user"
  );

  /*
   * Loading
   */

  const loading =
    addLoadingMessage();

  try {

    /*
     * اتصال مستقیم به Cloudflare Pages Function
     */

    const response =
      await fetch(
        CHAT_API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message:
                userMessage
            })
        }
      );


    /*
     * خواندن پاسخ
     */

    let data;

    try {

      data =
        await response.json();

    } catch (error) {

      throw new Error(
        "پاسخ API معتبر نیست."
      );

    }


    /*
     * حذف Loading
     */

    if (loading) {
      loading.remove();
    }


    /*
     * خطای API
     */

    if (
      !response.ok ||
      data.success === false
    ) {

      const errorMessage =
        data?.error ||
        "ارتباط با هوش مصنوعی برقرار نشد.";

      addChatMessage(
        "❌ " + errorMessage,
        "ai"
      );

      console.error(
        "Yar API error:",
        data
      );

      return;
    }


    /*
     * دریافت پاسخ AI
     */

    let aiResponse =
      data?.reply;


    if (
      typeof aiResponse !== "string" ||
      !aiResponse.trim()
    ) {

      aiResponse =
        data?.message;

    }


    if (
      typeof aiResponse !== "string"
    ) {

      addChatMessage(
        "❌ هوش مصنوعی پاسخ قابل استفاده‌ای برنگرداند.",
        "ai"
      );

      return;
    }


    /*
     * حذف Thinking
     */

    aiResponse =
      cleanAIResponse(
        aiResponse
      );


    /*
     * پاسخ خالی
     */

    if (!aiResponse) {

      addChatMessage(
        "متأسفم، پاسخی دریافت نشد. لطفاً دوباره تلاش کنید.",
        "ai"
      );

      return;
    }


    /*
     * فقط پاسخ نهایی AI
     */

    addChatMessage(
      aiResponse,
      "ai"
    );

  }

  catch (error) {

    /*
     * حذف Loading
     */

    if (loading) {
      loading.remove();
    }


    console.error(
      "Yar AI connection error:",
      error
    );


    addChatMessage(
      "❌ ارتباط با هوش مصنوعی برقرار نشد. لطفاً اینترنت و API را بررسی کنید.",
      "ai"
    );

  }

}


/* =====================================================
   اتصال فرم
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    const form =
      document.getElementById(
        "chatForm"
      );

    const input =
      document.getElementById(
        "messageInput"
      );

    const sendButton =
      document.getElementById(
        "sendButton"
      );


    if (!form || !input) {

      console.warn(
        "Chat form or message input not found."
      );

      return;
    }


    /*
     * ارسال فرم
     */

    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const message =
          input.value.trim();


        if (!message) {
          return;
        }


        /*
         * پاک کردن ورودی
         */

        input.value = "";


        /*
         * غیرفعال کردن دکمه
         */

        if (sendButton) {
          sendButton.disabled = true;
        }


        try {

          await sendMessageToAI(
            message
          );

        }

        finally {

          if (sendButton) {
            sendButton.disabled = false;
          }

          input.focus();

        }

      }
    );


    /*
     * Enter برای ارسال
     */

    input.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          form.requestSubmit();

        }

      }
    );

  }
);

</script>

</body>
  </html>
