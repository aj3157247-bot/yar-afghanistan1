<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>یار افغانستان</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .app {
      max-width: 900px;
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #075e54;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 7px 0 0;
      opacity: 0.9;
      font-size: 14px;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      padding: 10px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .tool {
      border: 0;
      background: #eef3f5;
      padding: 10px 5px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
    }

    .tool.active {
      background: #075e54;
      color: white;
    }

    #chatMessages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      min-height: 55vh;
    }

    .message {
      display: flex;
      margin: 10px 0;
    }

    .user-message {
      justify-content: flex-start;
    }

    .ai-message {
      justify-content: flex-end;
    }

    .message-content {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 15px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user-message .message-content {
      background: #d9fdd3;
    }

    .ai-message .message-content {
      background: white;
      border: 1px solid #ddd;
    }

    .loading-message .message-content {
      color: #777;
    }

    .input-area {
      background: white;
      border-top: 1px solid #ddd;
      padding: 12px;
      position: sticky;
      bottom: 0;
    }

    #chatForm {
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      resize: none;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 12px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    #messageInput:focus {
      border-color: #075e54;
    }

    #sendButton {
      border: 0;
      border-radius: 12px;
      background: #075e54;
      color: white;
      padding: 0 20px;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .welcome {
      text-align: center;
      padding: 45px 20px;
      color: #555;
    }

    .welcome h2 {
      color: #075e54;
      margin-bottom: 10px;
    }

    @media (max-width: 600px) {
      .tools {
        grid-template-columns: repeat(3, 1fr);
      }

      .message-content {
        max-width: 92%;
      }

      #sendButton {
        padding: 0 14px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>🤖 یار افغانستان</h1>
    <p>دستیار هوشمند دری، پشتو و انگلیسی</p>
  </header>

  <div class="tools">

    <button class="tool active" data-mode="chat">
      💬 چت
    </button>

    <button class="tool" data-mode="translate">
      🌐 مترجم
    </button>

    <button class="tool" data-mode="study">
      📚 کمک‌درسی
    </button>

    <button class="tool" data-mode="writing">
      ✍️ نوشتن
    </button>

    <button class="tool" data-mode="ad">
      📢 آگهی
    </button>

  </div>

  <main id="chatMessages">

    <div class="welcome">
      <h2>سلام! 👋</h2>

      <p>
        من یار افغانستان هستم.
        می‌توانم در چت، ترجمه، درس، نوشتن و ساخت آگهی به شما کمک کنم.
      </p>

      <p>
        پیام خود را بنویسید و ارسال کنید.
      </p>
    </div>

  </main>

  <div class="input-area">

    <form id="chatForm">

      <textarea
        id="messageInput"
        rows="2"
        placeholder="پیامتان را بنویسید..."
        autocomplete="off"
      ></textarea>

      <button
        id="sendButton"
        type="submit"
      >
        ➤
      </button>

    </form>

  </div>

</div>


<!-- =====================================================
     YAR AFGHANISTAN JAVASCRIPT
     مهم: کد JavaScript باید داخل همین script باشد
===================================================== -->

<script>

const CHAT_API_URL = "/api/chat";


// =====================================================
// پاک کردن Thinking / Reasoning
// =====================================================

function cleanAIResponse(text) {

  if (!text || typeof text !== "string") {
    return "";
  }

  let result = text;

  result = result.replace(
    /<think[\s\S]*?<\/think>/gi,
    ""
  );

  result = result.replace(
    /<thinking[\s\S]*?<\/thinking>/gi,
    ""
  );

  result = result.replace(
    /<reasoning[\s\S]*?<\/reasoning>/gi,
    ""
  );

  result = result.replace(
    /<analysis[\s\S]*?<\/analysis>/gi,
    ""
  );

  result = result.replace(
    /^\s*(thinking|reasoning|analysis)\s*:\s*[\s\S]*?(?=\n\s*(answer|final|پاسخ)\s*:)/i,
    ""
  );

  result = result.replace(
    /^\s*(answer|final|پاسخ نهایی|پاسخ)\s*:\s*/i,
    ""
  );

  return result.trim();
}


// =====================================================
// نمایش پیام
// =====================================================

function addChatMessage(text, sender = "ai") {

  const chatContainer =
    document.getElementById("chatMessages");

  if (!chatContainer) {
    return null;
  }

  const welcome =
    chatContainer.querySelector(".welcome");

  if (welcome) {
    welcome.remove();
  }

  const messageElement =
    document.createElement("div");

  messageElement.className =
    sender === "user"
      ? "message user-message"
      : "message ai-message";

  const content =
    document.createElement("div");

  content.className =
    "message-content";

  /*
   * بسیار مهم:
   * پاسخ AI با textContent نمایش داده می‌شود.
   * بنابراین کد HTML یا JavaScript اجرا نمی‌شود.
   */

  content.textContent = text;

  messageElement.appendChild(content);

  chatContainer.appendChild(messageElement);

  chatContainer.scrollTop =
    chatContainer.scrollHeight;

  return messageElement;
}


// =====================================================
// Loading
// =====================================================

function addLoadingMessage() {

  const chatContainer =
    document.getElementById("chatMessages");

  if (!chatContainer) {
    return null;
  }

  const loading =
    document.createElement("div");

  loading.className =
    "message ai-message loading-message";

  const content =
    document.createElement("div");

  content.className =
    "message-content";

  content.textContent =
    "در حال پاسخ...";

  loading.appendChild(content);

  chatContainer.appendChild(loading);

  chatContainer.scrollTop =
    chatContainer.scrollHeight;

  return loading;
}


// =====================================================
// ارسال پیام به Cloudflare API
// =====================================================

async function sendMessageToAI(message) {

  const userMessage =
    typeof message === "string"
      ? message.trim()
      : "";

  if (!userMessage) {
    return;
  }

  addChatMessage(
    userMessage,
    "user"
  );

  const loading =
    addLoadingMessage();

  try {

    const response =
      await fetch(
        CHAT_API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            message: userMessage
          })
        }
      );


    let data;

    try {

      data =
        await response.json();

    } catch (error) {

      throw new Error(
        "پاسخ API معتبر نیست."
      );

    }


    if (loading) {
      loading.remove();
    }


    if (
      !response.ok ||
      data.success === false
    ) {

      console.error(
        "Yar API error:",
        data
      );

      addChatMessage(
        "❌ " +
        (
          data.error ||
          "ارتباط با هوش مصنوعی برقرار نشد."
        ),
        "ai"
      );

      return;
    }


    let aiResponse =
      data.reply;


    if (
      typeof aiResponse !== "string" ||
      !aiResponse.trim()
    ) {

      aiResponse =
        data.message;

    }


    if (
      typeof aiResponse !== "string"
    ) {

      addChatMessage(
        "❌ هوش مصنوعی پاسخ قابل استفاده‌ای برنگرداند.",
        "ai"
      );

      return;
    }


    aiResponse =
      cleanAIResponse(
        aiResponse
      );


    if (!aiResponse) {

      addChatMessage(
        "متأسفم، پاسخی دریافت نشد. دوباره تلاش کنید.",
        "ai"
      );

      return;
    }


    addChatMessage(
      aiResponse,
      "ai"
    );


  } catch (error) {

    console.error(
      "Yar AI connection error:",
      error
    );

    if (loading) {
      loading.remove();
    }

    addChatMessage(
      "❌ ارتباط با هوش مصنوعی برقرار نشد. لطفاً اینترنت و API را بررسی کنید.",
      "ai"
    );

  }

}


// =====================================================
// حالت‌های پنج‌گانه
// =====================================================

let currentMode = "chat";


const modePrompts = {

  chat:
    "",

  translate:
    "تو مترجم یار افغانستان هستی. متن زیر را دقیق و طبیعی ترجمه کن. زبان مقصد را از متن یا درخواست کاربر تشخیص بده. فقط ترجمه را ارائه کن:\n\n",

  study:
    "تو یک معلم صبور و حرفه‌ای هستی. سوال درسی کاربر را مرحله‌به‌مرحله و ساده توضیح بده و در صورت نیاز مثال بزن:\n\n",

  writing:
    "به کاربر در نوشتن متن حرفه‌ای کمک کن. متن آماده و قابل استفاده ارائه بده و از توضیحات اضافی خودداری کن:\n\n",

  ad:
    "برای کاربر یک آگهی جذاب، واضح و حرفه‌ای بساز. عنوان، توضیح کوتاه و اطلاعات مهم را در نظر بگیر:\n\n"

};


// =====================================================
// انتخاب بخش
// =====================================================

document
  .querySelectorAll(".tool")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".tool")
          .forEach(btn => {
            btn.classList.remove("active");
          });

        button.classList.add("active");

        currentMode =
          button.dataset.mode || "chat";


        const input =
          document.getElementById(
            "messageInput"
          );


        const placeholders = {

          chat:
            "پیامتان را بنویسید...",

          translate:
            "متنی را که می‌خواهید ترجمه شود بنویسید...",

          study:
            "سوال درسی خود را بنویسید...",

          writing:
            "چه متنی می‌خواهید بنویسید؟",

          ad:
            "اطلاعات آگهی خود را بنویسید..."

        };


        if (input) {

          input.placeholder =
            placeholders[currentMode] ||
            placeholders.chat;

          input.focus();

        }

      }
    );

  });


// =====================================================
// اتصال فرم
// =====================================================

document.addEventListener(
  "DOMContentLoaded",
  () => {

    const form =
      document.getElementById(
        "chatForm"
      );

    const input =
      document.getElementById(
        "messageInput"
      );

    const sendButton =
      document.getElementById(
        "sendButton"
      );


    if (!form || !input) {

      console.error(
        "Chat form or input not found."
      );

      return;
    }


    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const message =
          input.value.trim();


        if (!message) {
          return;
        }


        input.value = "";


        if (sendButton) {
          sendButton.disabled = true;
        }


        let finalMessage =
          message;


        /*
         * برای چهار بخش ویژه،
         * درخواست را قبل از ارسال به API
         * با دستور مربوط به همان بخش ترکیب می‌کنیم.
         */

        if (
          currentMode !== "chat" &&
          modePrompts[currentMode]
        ) {

          finalMessage =
            modePrompts[currentMode] +
            message;

        }


        try {

          await sendMessageToAI(
            finalMessage
          );

        } finally {

          if (sendButton) {
            sendButton.disabled = false;
          }

          input.focus();

        }

      }
    );


    input.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          form.requestSubmit();

        }

      }
    );

  });

</script>

</body>
</html>
