<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>یار افغانستان</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #0b1020;
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      padding: 18px;
      background:
        radial-gradient(circle at top right, rgba(80,100,255,.18), transparent 35%),
        #0b1020;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 45px;
      height: 45px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      background: linear-gradient(135deg,#5969ff,#00c9a7);
    }

    .brand h1 {
      font-size: 20px;
    }

    .brand p {
      color: #8791a8;
      font-size: 11px;
      margin-top: 4px;
    }

    .clear {
      background: #151d31;
      border: 1px solid #283149;
      color: #aeb7ca;
      border-radius: 12px;
      padding: 9px 11px;
      cursor: pointer;
    }

    .chat {
      height: calc(100vh - 190px);
      min-height: 430px;
      overflow-y: auto;
      padding: 8px 2px 15px;
    }

    .welcome {
      text-align: center;
      padding: 70px 20px 30px;
    }

    .welcome .big {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .welcome h2 {
      font-size: 22px;
      margin-bottom: 9px;
    }

    .welcome p {
      color: #8993aa;
      font-size: 13px;
      line-height: 2;
    }

    .message {
      display: flex;
      margin: 10px 0;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.ai {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 18px;
      line-height: 1.9;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: #202b49;
      border-bottom-right-radius: 5px;
    }

    .ai .bubble {
      background: linear-gradient(135deg,#4658d9,#33429f);
      border-bottom-left-radius: 5px;
    }

    .input-area {
      position: sticky;
      bottom: 0;
      display: flex;
      gap: 8px;
      padding-top: 10px;
      background: linear-gradient(transparent,#0b1020 20%);
    }

    .input-area input {
      flex: 1;
      min-width: 0;
      height: 52px;
      padding: 0 15px;
      border-radius: 17px;
      border: 1px solid #29334c;
      outline: none;
      background: #121a2d;
      color: white;
      font-size: 14px;
    }

    .input-area input::placeholder {
      color: #68748c;
    }

    .send {
      width: 52px;
      height: 52px;
      border: 0;
      border-radius: 17px;
      color: white;
      background: linear-gradient(135deg,#5969ff,#7b55ff);
      font-size: 20px;
      cursor: pointer;
    }

    .send:active {
      transform: scale(.95);
    }

    .typing {
      opacity: .7;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="app">

  <header class="top">
    <div class="brand">
      <div class="logo">✨</div>
      <div>
        <h1>یار افغانستان</h1>
        <p>دستیار هوشمند تو</p>
      </div>
    </div>

    <button class="clear" onclick="clearChat()">پاک کردن</button>
  </header>

  <main class="chat" id="chat">

    <div class="welcome" id="welcome">
      <div class="big">🤖</div>
      <h2>سلام! من یار هستم 👋</h2>
      <p>
        سوالت را بنویس.<br>
        فعلاً بدون اینترنت هم می‌توانیم آزمایش کنیم.
      </p>
    </div>

  </main>

  <div class="input-area">
    <input
      id="input"
      type="text"
      placeholder="پیامت را بنویس..."
      onkeydown="handleKey(event)"
    >

    <button class="send" onclick="sendMessage()">➤</button>
  </div>

</div>

<script>

  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  const welcome = document.getElementById("welcome");

  function handleKey(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  }

  function addMessage(text, type) {

    if (welcome) {
      welcome.remove();
    }

    const message = document.createElement("div");
    message.className = "message " + type;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    message.appendChild(bubble);
    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
  }

  function getAIResponse(text) {

    const t = text.toLowerCase();

    if (
      t.includes("سلام") ||
      t.includes("hello") ||
      t.includes("hi")
    ) {
      return "سلام! 👋 من یار افغانستان هستم.\nچطور می‌توانم کمکت کنم؟";
    }

    if (
      t.includes("خوبی") ||
      t.includes("چطوری")
    ) {
      return "ممنون! 😊 من آماده‌ام به تو کمک کنم.";
    }

    if (
      t.includes("ترجمه") ||
      t.includes("translate")
    ) {
      return "حتماً 🌐\nدر نسخه بعدی می‌توانم ترجمه دری، پشتو و انگلیسی را به‌صورت واقعی انجام بدهم.";
    }

    if (
      t.includes("پشتو")
    ) {
      return "پشتو به‌زودی به‌صورت کامل به یار اضافه می‌شود 🇦🇫";
    }

    if (
      t.includes("درس") ||
      t.includes("ریاضی") ||
      t.includes("سوال")
    ) {
      return "📚 سوالت را بفرست.\nدر نسخه بعدی می‌توانیم حل و توضیح درس‌ها را با هوش مصنوعی واقعی اضافه کنیم.";
    }

    if (
      t.includes("آگهی") ||
      t.includes("فروش")
    ) {
      return "🛒 می‌توانم برایت آگهی حرفه‌ای بسازم.\nمثلاً نام محصول، قیمت و وضعیت آن را بفرست.";
    }

    if (
  t.includes("کمک") ||
  t.includes("چه کار") ||
  t.includes("چه کاری") ||
  t.includes("چه کارهایی") ||
  t.includes("قابلیت") ||
  t.includes("توانایی")
) {
  return "من «یار افغانستان» هستم 🤖🇦🇫\n\nفعلاً می‌توانم این کارها را انجام بدهم:\n\n🌐 ترجمه متن\n📚 کمک درسی\n✍️ نوشتن و اصلاح متن\n🛒 ساخت آگهی فروش\n💡 پاسخ به سؤال‌های ساده\n💬 گفت‌وگوی فارسی/دری\n\n🚀 قابلیت‌های بعدی:\n🎙️ صحبت با صدا\n📷 خواندن متن از عکس\n🇦🇫 ترجمه دری ↔ پشتو\n🧠 اتصال به هوش مصنوعی واقعی";
  }
      return "من می‌توانم در آینده در این کارها کمکت کنم:\n\n🌐 ترجمه\n📷 خواندن عکس\n📚 درس\n✍️ نوشتن متن\n🛒 ساخت آگهی";
    }

    return "پیامت را دریافت کردم ✅\n\nفعلاً نسخه آزمایشی یار هستم و هنوز به هوش مصنوعی واقعی وصل نشده‌ام. 🤖\n\nدر مرحله بعد موتور هوش مصنوعی واقعی را اضافه می‌کنیم.";
  }

  function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";

    setTimeout(() => {

      const response = getAIResponse(text);

      addMessage(response, "ai");

    }, 500);
  }

  function clearChat() {

    chat.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="big">🤖</div>
        <h2>سلام! من یار هستم 👋</h2>
        <p>
          سوالت را بنویس.<br>
          فعلاً بدون اینترنت هم می‌توانیم آزمایش کنیم.
        </p>
      </div>
    `;
  }

</script>

</body>
</html>
